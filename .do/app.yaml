# DigitalOcean App Platform specification for the lyrics catalog.
#
# One origin: the frontend at `/`, the Go service at `/api`, so the bundle uses
# relative URLs and survives a domain change without a rebuild.
#
# Apply with `./scripts/deploy-do.sh`, which fills the placeholders from `.env`.
# This file is tracked, so it holds no secrets.

name: lyrics
region: fra

# Development tier (single node, one day of backups): the catalog can be rebuilt
# from `songs.ndjson`. `production: true` plus a `cluster_name` upgrades it.
databases:
  - name: db
    engine: PG
    version: "17"
    production: false

# Migrations run as a pre-deploy job, which completes before any new container
# serves traffic. It shares the API's image, so schema and code match.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: chrispanag/lyrics
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    # The image has no ENTRYPOINT precisely so this replaces the command rather
    # than being appended to the API's arguments.
    run_command: /app/migrate
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

services:
  - name: api
    github:
      repo: chrispanag/lyrics
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    # /api/v1/health pings the database, so a service that cannot reach Postgres
    # is never rolled into rotation. The initial delay covers the JWKS fetch the
    # verifier performs at startup.
    health_check:
      http_path: /api/v1/health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

      # Follows the app's primary domain (or its ondigitalocean.app host).
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}

      - key: PRELUDE_API_BASE
        scope: RUN_TIME
        value: https://api.prelude.dev
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
      # The peer address here is the ingress, so without this the registration
      # rate limit is one global bucket. Not X-Forwarded-For: on App Platform it
      # carries the ingress's address. Leave unset locally. See CLAUDE.md,
      # "Deployment".
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: DO-Connecting-IP

      # --- filled in by scripts/deploy-do.sh from .env ---------------------
      - key: PRELUDE_APP_ID
        scope: RUN_TIME
        value: SET_BY_DEPLOY_SCRIPT
      # Must match the web component's NEXT_PUBLIC_PRELUDE_SESSION_DOMAIN below:
      # Prelude's issuer is per-host, so a mismatch rejects every token.
      - key: PRELUDE_SESSION_DOMAIN
        scope: RUN_TIME
        value: SET_BY_DEPLOY_SCRIPT
      - key: PRELUDE_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: SET_BY_DEPLOY_SCRIPT
      # Applies only when an account is first provisioned; adding an address
      # here does not promote an existing user.
      - key: ADMIN_EMAILS
        scope: RUN_TIME
        value: SET_BY_DEPLOY_SCRIPT

  # A service, not a static site: Next renders every document in a Node
  # process, one App Router route per screen.
  - name: web
    github:
      repo: chrispanag/lyrics
      branch: main
      deploy_on_push: true
    source_dir: web
    build_command: pnpm run build
    run_command: pnpm start
    # `next start -p 3000` — the port is in web/package.json's start script, and
    # the two have to agree.
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    # Only checks that the Node process serves; the data path is the API's check.
    health_check:
      http_path: /
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      # Where the Node process reaches the API while rendering a document.
      # RUN_TIME only. The web client reads it off a `process.env` binding so
      # Next does not inline it at `next build`, before this value exists; an
      # inlined read requests localhost and the catalog HTML ships with no songs.
      # The private URL stays on the app network and calls /api/v1 on the port
      # the API listens on.
      - key: API_ORIGIN
        scope: RUN_TIME
        value: ${api.PRIVATE_URL}

      # Leave NEXT_PUBLIC_API_BASE_URL unset: Next inlines it at build time, and
      # unset means the bundle calls its own origin.
      #
      # Publishable client identifiers, unlike PRELUDE_API_KEY.
      - key: NEXT_PUBLIC_PRELUDE_APP_ID
        scope: BUILD_TIME
        value: SET_BY_DEPLOY_SCRIPT
      - key: NEXT_PUBLIC_PRELUDE_SDK_KEY
        scope: BUILD_TIME
        value: SET_BY_DEPLOY_SCRIPT
      # Must equal the API's PRELUDE_SESSION_DOMAIN. BUILD_TIME: Next inlines it.
      - key: NEXT_PUBLIC_PRELUDE_SESSION_DOMAIN
        scope: BUILD_TIME
        value: SET_BY_DEPLOY_SCRIPT
      # The login configuration password reset mails its code through. Required:
      # the deploy script refuses to run without it.
      - key: NEXT_PUBLIC_PRELUDE_OTP_LOGIN_CONFIG_ID
        scope: BUILD_TIME
        value: SET_BY_DEPLOY_SCRIPT

# Longest prefix wins. preserve_path_prefix is load-bearing: the router mounts at
# /api/v1, and without it App Platform strips /api and every route 404s.
# A Next route handler under app/api/ is unreachable in production.
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
