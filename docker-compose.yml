name: lyrics

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lyrics
      POSTGRES_PASSWORD: lyrics
      POSTGRES_DB: lyrics
      # Deterministic collation, so ordering does not shift with the host locale.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyrics -d lyrics"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://lyrics:lyrics@db:5432/lyrics?sslmode=disable
      PORT: "8080"
      # Not `:?`: that fails at parse time, breaking even `docker compose up db`.
      # The API validates its own configuration at boot.
      PRELUDE_APP_ID: ${PRELUDE_APP_ID:-}
      PRELUDE_API_KEY: ${PRELUDE_API_KEY:-}
      PRELUDE_API_BASE: ${PRELUDE_API_BASE:-https://api.prelude.dev}
      # Must match the web build arg below: the token issuer follows this host.
      PRELUDE_SESSION_DOMAIN: ${PRELUDE_SESSION_DOMAIN:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_PRELUDE_APP_ID: ${PRELUDE_APP_ID:-}
        NEXT_PUBLIC_PRELUDE_SDK_KEY: ${PRELUDE_SDK_KEY:-}
        NEXT_PUBLIC_PRELUDE_SESSION_DOMAIN: ${PRELUDE_SESSION_DOMAIN:-}
        NEXT_PUBLIC_PRELUDE_OTP_LOGIN_CONFIG_ID: ${PRELUDE_OTP_LOGIN_CONFIG_ID:-}
    # Where the Node process reaches the API for server-render fetches. Run
    # time, not a build arg: there it would silently do nothing (web/Dockerfile
    # has no ARG/ENV for it). See CLAUDE.md, "Environment".
    environment:
      API_ORIGIN: http://api:8080
    # `next start` listens on 3000; 5173 is what CORS_ORIGINS above names.
    ports:
      - "5173:3000"
    depends_on:
      - api

volumes:
  db_data:
