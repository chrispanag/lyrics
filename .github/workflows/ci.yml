name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, and the default token grant is often
# write — which every third-party action in this workflow would inherit.
permissions:
  contents: read

# A new push makes an in-flight run for the same branch obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the jobs below a pull request needs, so a change confined
  # to one stack does not wait on the other's suite. A skipped job reports as
  # passing, so this stays compatible with required status checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}

    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base branch tip — so two commits are enough to diff exactly what the
      # pull request would change, however far its branch is behind.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Pushes to main run everything, as does any edit to this workflow, since
      # a change here can break a job that no changed path would otherwise run.
      - name: Diff against base
        id: diff
        run: |
          all=false changed=
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            all=true
          else
            changed=$(git diff --name-only HEAD^1 HEAD)
            printf '%s\n' "$changed"
            if grep -qx '.github/workflows/ci.yml' <<<"$changed"; then all=true; fi
          fi
          for area in backend:backend frontend:web; do
            name=${area%%:*} dir=${area#*:}
            if $all || grep -q "^$dir/" <<<"$changed"; then v=true; else v=false; fi
            echo "$name=$v" | tee -a "$GITHUB_OUTPUT"
          done

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must match the Compose image: the schema depends on unaccent,
        # pg_trgm, and a custom text search configuration.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lyrics
          POSTGRES_PASSWORD: lyrics
          POSTGRES_DB: lyrics
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lyrics -d lyrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # v8 or later: earlier majors install golangci-lint v1, which refuses this
      # module's Go version. `make lint-backend` reads this pin and refuses any
      # other local version.
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.15.0

      - name: Test
        working-directory: backend
        env:
          # Without it the integration tests skip and a broken schema goes green.
          TEST_DATABASE_URL: postgres://lyrics:lyrics@localhost:5433/lyrics?sslmode=disable
        run: go test ./... -count=1 -race

      - name: Build
        working-directory: backend
        run: go build ./...

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version web/package.json pins in `packageManager`.
      # It has to come before setup-node, whose pnpm cache needs it on PATH.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      # engines.node is also what App Platform's Node buildpack builds
      # production with, so reading it here keeps CI on the same major.
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm run typecheck

      - name: Lint
        working-directory: web
        run: pnpm run lint

      # With coverage, so the thresholds in vitest.config.ts are enforced.
      - name: Test
        working-directory: web
        run: pnpm run test:coverage

      # Every story is also a test (its play function plus an axe check), run
      # in a real browser rather than jsdom.
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Story tests
        working-directory: web
        run: pnpm run test:stories

      # A base URL is set only because this is a smoke test of the build; the
      # real production build leaves it unset so the bundle calls its own origin.
      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: pnpm exec next build

  docker:
    name: Docker images
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Built but not pushed: this proves the Dockerfiles still work, which a
      # `go build` alone does not.
      - name: Build API image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max
