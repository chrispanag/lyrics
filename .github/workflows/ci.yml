name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, and the default token grant is often
# write — which every third-party action in this workflow would inherit.
permissions:
  contents: read

# A new push makes an in-flight run for the same branch obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must match the Compose image: the schema depends on unaccent,
        # pg_trgm, and a custom text search configuration.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lyrics
          POSTGRES_PASSWORD: lyrics
          POSTGRES_DB: lyrics
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lyrics -d lyrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # Keep this action on v8 or later: earlier majors install the last
      # golangci-lint v1 release, which is built with Go 1.24 and refuses a
      # module targeting 1.25 outright — it fails before linting anything.
      # The version is pinned so CI and `make check` run the same binary.
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.9.0

      - name: Test
        working-directory: backend
        env:
          # The suite creates a database per test binary from this connection.
          # Without it the integration tests would skip themselves and a broken
          # schema would report as a green build.
          TEST_DATABASE_URL: postgres://lyrics:lyrics@localhost:5433/lyrics?sslmode=disable
        run: go test ./... -count=1 -race

      - name: Build
        working-directory: backend
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npx vite build

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Built but not pushed: this proves the Dockerfiles still work, which a
      # `go build` alone does not.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max
