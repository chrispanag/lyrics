name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, and the default token grant is often
# write — which every third-party action in this workflow would inherit.
permissions:
  contents: read

# A new push makes an in-flight run for the same branch obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job sets `timeout-minutes`: each takes a minute or two warm, and the
# default is six hours, which is what a hung test or a stuck service container
# would otherwise hold a runner for. There is no workflow-level setting.
jobs:
  # Decides which of the jobs below a pull request needs, so a change confined
  # to one stack does not wait on the other's suite. A skipped job reports as
  # passing, so this stays compatible with required status checks — which is
  # also why the jobs below gate on `!= 'false'` under `!cancelled()`: if this
  # job fails, its outputs are empty and everything runs, rather than every
  # check skipping and reading as green with nothing tested.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      web: ${{ steps.diff.outputs.web }}

    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base branch tip — so two commits are enough to diff exactly what the
      # pull request would change, however far its branch is behind.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      # Pushes to main run everything, as does any edit to this workflow, since
      # a change here can break a job that no changed path would otherwise run.
      # `--no-renames` lists both ends of a move, so a file moved out of a stack
      # still counts against it; `core.quotePath=false` keeps a non-ASCII path
      # (a Greek file name) unquoted, where it would otherwise start with `"`
      # and never match its directory.
      - name: Diff against base
        id: diff
        run: |
          all=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            all=true
          else
            changed=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)
            printf '%s\n' "$changed"
            if grep -qxF '.github/workflows/ci.yml' <<<"$changed"; then all=true; fi
          fi
          for dir in backend web; do
            if $all || grep -q "^$dir/" <<<"$changed"; then v=true; else v=false; fi
            echo "$dir=$v" | tee -a "$GITHUB_OUTPUT"
          done

  backend:
    name: Backend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Must match the Compose image: the schema depends on unaccent,
        # pg_trgm, and a custom text search configuration.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lyrics
          POSTGRES_PASSWORD: lyrics
          POSTGRES_DB: lyrics
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lyrics -d lyrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        working-directory: backend
        run: go vet ./...

      # v8 or later: earlier majors install golangci-lint v1, which refuses this
      # module's Go version. `make lint-backend` reads this pin and refuses any
      # other local version.
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.15.0

      - name: Test
        working-directory: backend
        env:
          # Without it the integration tests skip and a broken schema goes green.
          TEST_DATABASE_URL: postgres://lyrics:lyrics@localhost:5433/lyrics?sslmode=disable
        run: go test ./... -count=1 -race

      - name: Build
        working-directory: backend
        run: go build ./...

  frontend:
    name: Frontend
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version web/package.json pins in `packageManager`.
      # It has to come before setup-node, whose pnpm cache needs it on PATH.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      # engines.node is also what App Platform's Node buildpack builds
      # production with, so reading it here keeps CI on the same major.
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm run typecheck

      - name: Lint
        working-directory: web
        run: pnpm run lint

      # With coverage, so the thresholds in vitest.config.ts are enforced.
      - name: Test
        working-directory: web
        run: pnpm run test:coverage

      # Every story is also a test (its play function plus an axe check), run
      # in a real browser rather than jsdom. The browser is cached per
      # Playwright version, and `install` skips one it finds, so a cache hit
      # leaves only the system packages `--with-deps` adds, which live outside
      # the cached directory. The key also names the runner image: Playwright
      # downloads a build per distribution release but finds an installed one
      # by revision alone, so a cache saved on the previous `ubuntu-latest`
      # would be reused as is. The assignment is its own command so that a
      # failed lookup fails the step instead of writing an empty version.
      - name: Read Playwright version
        id: playwright
        working-directory: web
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          echo "key=playwright-${ImageOS}-${RUNNER_ARCH}-${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Story tests
        working-directory: web
        run: pnpm run test:stories

      # Turbopack's build cache, on by default since Next 16.3, is only read
      # if `.next/cache` survives between runs. Keyed on the commit, so every
      # build saves its own; the prefix restores the latest build on the same
      # lockfile. A key built from a list of source files instead skips the
      # save on an exact hit, so a change to a file the list missed leaves the
      # cache a build behind.
      - uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-

      # A base URL is set only because this is a smoke test of the build; the
      # real production build leaves it unset so the bundle calls its own origin.
      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: pnpm exec next build

  # Each image is built but not pushed: this proves the Dockerfiles still work,
  # which a `go build` or `next build` alone does not. One job per image, so
  # each is gated once and a green check names the image it actually built.
  docker-api:
    name: API image
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          # A scope per image: in the shared default scope, the image whose
          # build saved last replaced the other's cache index.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  docker-web:
    name: Web image
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
