<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Songfolio">
  <!-- Source for the `purpose: "maskable"` manifest icon. See icon-square.svg
       for why this comment sits inside the root element.

       Same artwork as icon-square.svg, scaled to 85%. A maskable icon is
       cropped by whatever shape the launcher uses — circle, squircle, teardrop
       — and only the centered circle of 80% diameter is guaranteed to survive.
       At full size the disc already clears that (outer edge 168 against a
       204.8 safe radius), so this inset is not rescuing the mark from being
       cut; it is what stops it reading as cramped against a circular mask.

       Declaring a maskable icon at all is the load-bearing part: without one,
       Android shrinks the icon into a white circle rather than bleeding the
       brand ground to the edge. -->
  <rect width="512" height="512" fill="#c6481c" />
  <circle cx="256" cy="256" r="129" fill="none" stroke="#fff" stroke-width="27" opacity="0.4" />
  <circle cx="256" cy="256" r="48" fill="#fff" />
</svg>
