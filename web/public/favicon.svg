<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Songfolio">
  <!-- The tab icon: the same record the sidebar and the auth screens use, drawn
       for 16px rather than scaled down from the lucide glyph, which turns to
       mush at that size. #c6481c is the `color-brand-600` custom property
       (oklch 0.57 0.17 38) converted to sRGB; nothing processes this file, so a
       change to the brand ramp has to be repeated here by hand — CLAUDE.md
       lists where else.

       The token drops its leading dashes and this comment sits inside the root
       element for the reason `icons/icon-square.svg` gives. The rounded corners
       here are why that file exists rather than this one being rasterized for
       the home-screen icons. -->
  <rect width="32" height="32" rx="7" fill="#c6481c" />
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="2" opacity="0.4" />
  <circle cx="16" cy="16" r="3.5" fill="#fff" />
</svg>
