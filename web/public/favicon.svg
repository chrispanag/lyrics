<!-- The tab icon: the same record the sidebar and the auth screens use, drawn
     for 16px rather than scaled down from the lucide glyph — an outline disc
     turns to mush at that size, so the color is carried by the tile and only
     two shapes survive. #c6481c is `--color-brand-600` (oklch 0.57 0.17 38)
     converted to sRGB; the token cannot be referenced from here, so a change
     to the brand ramp has to be repeated in this file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Songfolio">
  <rect width="32" height="32" rx="7" fill="#c6481c" />
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="2" opacity="0.4" />
  <circle cx="16" cy="16" r="3.5" fill="#fff" />
</svg>
