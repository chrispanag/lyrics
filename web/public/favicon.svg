<!-- The tab icon: the same record the sidebar and the auth screens use, drawn
     for 16px rather than scaled down from the lucide glyph, which turns to mush
     at that size. #c6481c is `--color-brand-600` (oklch 0.57 0.17 38) converted
     to sRGB; nothing processes this file, so a change to the brand ramp has to
     be repeated here by hand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Songfolio">
  <rect width="32" height="32" rx="7" fill="#c6481c" />
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="2" opacity="0.4" />
  <circle cx="16" cy="16" r="3.5" fill="#fff" />
</svg>
