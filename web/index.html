<!doctype html>
<!-- lang is the language of the *chrome*, which is English throughout: "Browse",
     "Sign in", "No users matched.". The Greek is content, and a song's lyrics
     carry no lang of their own — so a screen reader picks its voice from here,
     and `el` had it pronouncing the whole interface as Greek. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout extend under the notch and home
         indicator; the safe-area insets in index.css keep content clear of them. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Songfolio is a Greek and English song lyrics catalog: browse, search, and collect songs into lists."
    />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <!-- Four icon entries, and the .ico is not the legacy one of them. Every
         path here other than favicon.svg used to fall through to the SPA
         catchall and answer 200 with index.html — so a client that does not
         read SVG favicons (crawlers, feed readers, link-preview bots) got an
         HTML document where an icon should be, with a success status and so
         nothing to fall back to. Deleting one of these does not 404; it
         silently serves the app.

         The .ico goes FIRST and the SVG second: among the entries it supports a
         browser takes the last one, so this order gives the vector to everything
         that reads SVG and leaves the raster as the fallback it is meant to be.
         Reversed, the crisp icon is the one that never gets used. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- manifest.json, not the spec's preferred site.webmanifest extension.
         nginx ships no mime type for .webmanifest and App Platform stamps the
         type at upload with nothing in .do/app.yaml to override it, so the
         spec extension means one stack patched, the other unverifiable, and
         the two free to disagree. Every mime table knows .json, browsers parse
         a manifest regardless of its media type, and both stacks now agree by
         construction rather than by a config special case. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Link previews, for the domain being handed around. og:description
         opens differently from the meta description above on purpose — the
         card already carries the name in og:title, so it does not repeat it.

         og:image must be absolute: a card is fetched by a server with no page
         context to be relative to, and most scrapers do not resolve a relative
         one. So the origin is written out here, as it already is in og:url
         below and in icons/og-card.svg, which bakes the domain into the
         picture — a rename has to visit all three.

         Do not route it through a percent-delimited `VITE_SITE_ORIGIN`: Vite
         interpolates those in this file — including inside comments, so naming
         one here with its delimiters warns on every build. Per CLAUDE.md a new
         VITE_ variable has four mapping sites and only the deploy script
         complains when one is missed, so a local build would ship the literal
         placeholder and fail open. This origin is deployment identity,
         not a build input — unlike VITE_API_BASE_URL, which is left unset so
         the bundle calls its own origin at runtime. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Songfolio" />
    <meta property="og:url" content="https://songfolio.live" />
    <meta property="og:title" content="Songfolio" />
    <meta
      property="og:description"
      content="A Greek and English song lyrics catalog: browse, search, and collect songs into lists."
    />
    <meta property="og:image" content="https://songfolio.live/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Songfolio — a Greek and English song lyrics catalog"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The fallback title, and the one a scraper reads: og:title above is what
         a link card shows, and this is what a tab shows before React has
         rendered. Past first paint every route renders its own <title> through
         PageTitle, which React 19 hoists into this head and which wins. -->
    <title>Songfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
